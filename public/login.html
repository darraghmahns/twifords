<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open the book · The Twifords Try D.C.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b81d34">
<link rel="stylesheet" href="styles/organic.css">
<link rel="stylesheet" href="styles/palette.css">
<link rel="stylesheet" href="styles/login.css">
<script type="module" src="scripts/login.js"></script>
</head>
<body>
<main class="login">
  <div class="login-blob login-blob-rose" aria-hidden="true"></div>
  <div class="login-blob login-blob-red" aria-hidden="true"></div>
  <form class="login-card" id="login-form" method="post" action="/api/login" novalidate>
    <span class="login-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.9-10-9.2C.2 8.6 1.6 5 5 5c2 0 3.2 1.1 4 2.3C9.8 6.1 11 5 13 5c3.4 0 4.8 3.6 3 6.8C19.5 16.1 12 21 12 21z"/></svg>
    </span>
    <span class="login-kicker">First Edition · Washington, D.C.</span>
    <h1 class="login-title">The Twifords Try D.C.</h1>
    <p class="login-lede">This book was made for Jack &amp; Anne. Enter the password from Rae Rae &amp; Darragh to open it.</p>
    <input type="hidden" name="next" id="login-next" value="/">
    <label class="login-field">
      <span>Password</span>
      <input class="input" type="password" name="password" autocomplete="current-password" required autofocus>
    </label>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn-primary login-submit" type="submit" id="login-submit">Open the book</button>
  </form>
</main>
</body>
</html>
