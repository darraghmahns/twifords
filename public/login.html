<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | The Twifords Try D.C.</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#b81d34">
<link rel="stylesheet" href="styles/organic.css">
<link rel="stylesheet" href="styles/login.css">
<script type="module" src="scripts/login.js"></script>
</head>
<body>
<main class="login">
  <form id="login-form" class="login-card" method="post" action="/api/login" novalidate aria-label="Sign in">
    <input type="hidden" name="next" id="login-next" value="/">
    <input class="input" type="password" name="password" autocomplete="current-password" required aria-label="Password" aria-describedby="login-error" autofocus>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn-primary login-submit" type="submit" id="login-submit">Sign in</button>
  </form>
</main>
</body>
</html>
